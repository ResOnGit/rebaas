# REBAAS — Caddy TLS reverse proxy (optional override)
#
# Exposes 80/443 on the host. api-gw is no longer published on :8000 (internal only).
# Enable permanently:
#   sh run.sh config add caddy
#   # sets COMPOSE_FILE=docker-compose.yml:docker-compose.caddy.yml in .env
#
# Requires PROXY_DOMAIN in .env (DNS A/AAAA → this server).

services:

  api-gw:
    ports: !reset []

  caddy:
    container_name: rebaas-caddy
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      api-gw:
        condition: service_healthy
      studio:
        condition: service_healthy
    environment:
      PROXY_DOMAIN: ${PROXY_DOMAIN}
      PROXY_AUTH_USERNAME: ${DASHBOARD_USERNAME}
      PROXY_AUTH_PASSWORD: ${DASHBOARD_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        PROXY_AUTH_PASSWORD=$$(caddy hash-password --plaintext "$$PROXY_AUTH_PASSWORD") && \
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./volumes/proxy/caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
